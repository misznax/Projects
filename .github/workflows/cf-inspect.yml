name: CF inspect (tymczasowy)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          api(){ curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/$1"; echo; }
          echo "== account subdomain"; api "accounts/$A/workers/subdomain"
          echo "== projects script subdomain"; api "accounts/$A/workers/scripts/projects/subdomain"
          echo "== routes"; api "zones/a7d10025047c00e66f2ee32ca08beb02/workers/routes"
          echo "== dns"; api "zones/a7d10025047c00e66f2ee32ca08beb02/dns_records?per_page=100" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('errors'));[print(r['type'],r['name'],r['content'][:50],r['proxied']) for r in d.get('result',[])]"
          echo "== access apps raw"; api "accounts/$A/access/apps?per_page=5" | head -c 600
          echo "== probe"; for h in projects.smialo.org anatomia.smialo.org; do echo $h; curl -sS -m 15 -o /dev/null -w "%{http_code} %{redirect_url}\n" https://$h/05/ ; done
