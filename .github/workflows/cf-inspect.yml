name: CF inspect (tymczasowy)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          echo "== probe workers.dev"; curl -sS -m 20 -o /dev/null -w "%{http_code} %{redirect_url}\n" https://projects.michus.workers.dev/05/ || true
          echo "== probe api"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" https://projects.michus.workers.dev/api/stats || true
          echo "== attach anatomia.smialo.org"
          curl -sS -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$A/workers/domains" --data '{"hostname":"anatomia.smialo.org","service":"projects","zone_id":"a7d10025047c00e66f2ee32ca08beb02","environment":"production"}' || true; echo
          sleep 20
          echo "== probe anatomia"; curl -sS -m 20 -o /dev/null -w "%{http_code} %{redirect_url}\n" https://anatomia.smialo.org/ || true
