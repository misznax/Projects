name: CF inspect (tymczasowy)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          api(){ curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/$1"; echo; }
          echo "== verify"; api user/tokens/verify | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('result',{}).get('status'),d.get('errors'))"
          echo "== zones"; api "zones?per_page=50" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('errors'));[print(z['id'],z['name'],z['status']) for z in d.get('result',[])]"
          echo "== workers domains"; api "accounts/$A/workers/domains" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('errors'));[print(x.get('hostname'),x.get('service'),x.get('zone_name')) for x in d.get('result',[])]"
          echo "== access apps"; api "accounts/$A/access/apps?per_page=100" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('errors'));[print(x.get('id'),x.get('name'),x.get('domain'),x.get('type'),x.get('session_duration')) for x in d.get('result',[])]"
