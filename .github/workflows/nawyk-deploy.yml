name: Deploy Nawyk (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["02_Menedzer_dnia_Nawyk/**", ".github/workflows/nawyk-deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 02_Menedzer_dnia_Nawyk/build.py
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 02_Menedzer_dnia_Nawyk
          command: deploy
