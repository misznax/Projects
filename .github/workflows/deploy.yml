name: Deploy Projects (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["0*/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 00_Worker/build.py
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 00_Worker
          wranglerVersion: "4"
          command: deploy
      - name: Sync ANTHROPIC_API_KEY do Workera (jeśli jest w GitHub secrets)
        continue-on-error: true
        working-directory: 00_Worker
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$KEY" ]; then printf %s "$KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY && echo "ANTHROPIC_API_KEY ustawiony"; else echo "Brak ANTHROPIC_API_KEY w GitHub secrets"; fi
      - name: Sync GROQ_API_KEY do Workera (jeśli jest w GitHub secrets)
        continue-on-error: true
        working-directory: 00_Worker
        env:
          KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$KEY" ]; then printf %s "$KEY" | npx --yes wrangler@4 secret put GROQ_API_KEY && echo "GROQ_API_KEY ustawiony"; else echo "Brak GROQ_API_KEY w GitHub secrets"; fi
