name: Build StartupBoard
on:
  push:
    branches: [main]
    paths: ["01_StartupBoard/**", ".github/workflows/startupboard.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 01_StartupBoard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6-Essentials pypdfium2 pyinstaller
      - run: python build_exe.py
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete startupboard-latest -y --cleanup-tag || true
          gh release create startupboard-latest dist/StartupBoard_v*.zip --title "Startup Board (ZIP)" --notes "Rozpakuj ZIP i uruchom StartupBoard/StartupBoard.exe. Automatyczny build z ostatniego commita."
