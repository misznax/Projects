name: Build StartupBoard exe
on:
  push:
    branches: [main]
    paths: ["01_StartupBoard/**", ".github/workflows/startupboard.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 01_StartupBoard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6-Essentials pypdfium2 pyinstaller
      - run: pyinstaller --onefile --windowed --name StartupBoard --icon icon.ico --collect-all pypdfium2 --collect-all pypdfium2_raw startup_board.py
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete startupboard-latest -y --cleanup-tag || true
          gh release create startupboard-latest dist/StartupBoard.exe --title "StartupBoard (exe)" --notes "Automatyczny build z ostatniego commita"
