<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Studio Social</title>
<meta name="theme-color" content="#0e1113">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1113'/%3E%3Cpath d='M32 10l20 22-20 22L12 32z' fill='%23c4ee3c'/%3E%3Cpath d='M32 22l10 10-10 10-10-10z' fill='%2317b3a3'/%3E%3C/svg%3E">
<style>
:root{--bg:#06080b;--p1:#0c1115;--p2:#121820;--p3:#1a222b;--bd:#26303a;--tx:#e9edf2;--mut:#98a2ad;--acc:#ff7a1a;--acc2:#8b6cff;--bad:#ff6b5e;--warn:#ffc24a;--ok:#58d68d;--par:#7cc4ff;--quo:#ffd84d;--r:10px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.par{color:var(--par)}.quo{color:var(--quo)}
.top{height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--p1);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;white-space:nowrap}.logo b{color:var(--acc);font-size:20px}.logo small{color:var(--mut);font-weight:500}
#projName{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 9px;width:200px;font-weight:600}#projName:hover,#projName:focus{border-color:var(--bd);background:var(--p2);outline:none}
.tabs{display:flex;gap:4px;margin:0 auto}.tab{background:none;border:0;border-radius:9px;padding:8px 15px;cursor:pointer;color:var(--mut);font-weight:600}.tab:hover{background:var(--p2);color:var(--tx)}.tab.on{background:var(--p3);color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.right{display:flex;align-items:center;gap:10px}#saveState{color:var(--mut);font-size:12px;white-space:nowrap}#saveState.bad{color:var(--bad)}
.btn{background:var(--p3);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}.btn:hover{border-color:#425057;background:#2a3338}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(110deg,#ff5a00 0%,#ffa000 62%,#ffe600 100%);color:#1a0800;border-color:#ff7a1a;font-weight:800}.btn.pri:hover{filter:brightness(1.08)}.btn.sea{background:var(--acc2);color:#0a0620;border-color:var(--acc2);font-weight:700}.btn.bad{background:#3a1f1c;border-color:#6b2c26;color:#ffb3aa}.btn.sm{padding:4px 8px;font-size:12px}.btn.ghost{background:transparent}
.btn.on{background:var(--acc2);color:#0a0620;border-color:var(--acc2)}
.mbody a,.hint a{color:var(--par);text-decoration:underline}
#main{height:calc(100vh - 52px);position:relative}.mod{display:none;height:100%}.mod.on{display:grid}
.panel{background:var(--p1);border-right:1px solid var(--bd);overflow:auto;min-height:0}.panel.r{border-right:0;border-left:1px solid var(--bd)}
.ph{padding:10px 12px 6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px}
.sec{padding:8px 12px 12px;border-bottom:1px solid var(--bd)}.sec>label,.fld>label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.fld{margin-bottom:6px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}.row>.fix{flex:none}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;background:var(--p2);border:1px solid var(--bd);border-radius:7px;padding:6px 8px}input:focus,select:focus,textarea:focus{outline:1px solid var(--acc2);border-color:var(--acc2)}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--bd);background:none;border-radius:6px;cursor:pointer;flex:none}input[type=range]{width:100%;accent-color:var(--acc)}
textarea{resize:vertical;min-height:60px}
.hint{color:var(--mut);font-size:12px;line-height:1.5}.hint .par,.hint .quo{font-weight:500}
.zebra>*:nth-child(even){background:rgba(255,255,255,.035)}.zebra>*:nth-child(odd){background:rgba(0,0,0,.12)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700}.tag.ok{background:#16341f;color:var(--ok)}.tag.warn{background:#3a2f12;color:var(--warn)}.tag.bad{background:#3a1f1c;color:var(--bad)}.tag.off{background:#262c30;color:var(--mut)}
/* modal, toast, menu */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}.modal{background:var(--p1);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;width:min(640px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}.modal h2{margin:0 0 10px;font-size:18px}.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.modal.wide{width:min(980px,96vw)}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:200}.toast{background:var(--p3);border:1px solid var(--bd);border-left:4px solid var(--acc2);padding:9px 13px;border-radius:8px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.3s}.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}.toast.out{opacity:0;transform:translateY(8px)}
.popmenu{position:fixed;background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:5px;min-width:230px;z-index:150;box-shadow:0 12px 36px rgba(0,0,0,.5)}.popmenu hr{border:0;border-top:1px solid var(--bd);margin:4px 0}.mi{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;cursor:pointer}.mi:hover{background:var(--p3)}.mi i{font-style:normal;width:20px;text-align:center}
.pbar{height:12px;background:var(--p3);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a00,#ffa000 60%,#ffe600);transition:width .15s}.pinfo{margin-top:8px;color:var(--mut);font-size:12px}
/* stage */
.stagehost{position:relative;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#12171a 0 25%,#0f1315 0 50%) 0 0/24px 24px;overflow:hidden;outline:none;min-height:0}
.stage-wrap{position:relative;box-shadow:0 10px 50px rgba(0,0,0,.6);flex:none}.stage-cv{display:block;width:100%;height:100%;background:#fff}.stage-ov{position:absolute;inset:0;pointer-events:none}.stage-ov>*{pointer-events:none}
.selbox{position:absolute;border:1.5px solid var(--acc2);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}.selbox.locked{border-style:dashed;border-color:var(--warn)}.hd{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--acc2);border-radius:3px;pointer-events:auto!important;margin:-6px 0 0 -6px}
.hd.nw{left:0;top:0;cursor:nwse-resize}.hd.n{left:50%;top:0;cursor:ns-resize}.hd.ne{left:100%;top:0;cursor:nesw-resize}.hd.e{left:100%;top:50%;cursor:ew-resize}.hd.se{left:100%;top:100%;cursor:nwse-resize}.hd.s{left:50%;top:100%;cursor:ns-resize}.hd.sw{left:0;top:100%;cursor:nesw-resize}.hd.w{left:0;top:50%;cursor:ew-resize}.hd.rot{left:50%;top:-26px;border-radius:50%;background:var(--acc2);cursor:grab}
.guide{position:absolute;background:#ff4fd8}.guide.v{top:0;bottom:0;width:1px}.guide.h{left:0;right:0;height:1px}
.safe{position:absolute;background:rgba(255,80,80,.16);border:0}.safe-lbl{position:absolute;left:6px;font-size:10px;color:#ff9c9c;background:rgba(0,0,0,.4);padding:1px 5px;border-radius:4px}
/* creative */
#m-creative{grid-template-columns:230px 1fr 310px}
.films{padding:8px;display:flex;flex-direction:column;gap:8px}.film{position:relative;border:2px solid transparent;border-radius:8px;padding:3px;background:var(--p2);cursor:pointer}.film.on{border-color:var(--acc)}.film canvas{width:100%;display:block;border-radius:5px}.film .n{position:absolute;left:8px;top:6px;background:rgba(0,0,0,.65);padding:0 6px;border-radius:5px;font-size:11px}
.tool{display:flex;gap:6px;padding:8px 10px;background:var(--p1);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.tool .sep{width:1px;height:22px;background:var(--bd);margin:0 3px}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}.center .stagehost{flex:1}
.lyr{display:flex;align-items:center;gap:5px;padding:4px 8px;cursor:pointer;border-left:3px solid transparent}.lyr.on{border-left-color:var(--acc);background:var(--p3)!important}.lyr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lyr button{background:none;border:0;cursor:pointer;color:var(--mut);padding:2px 4px}.lyr button:hover{color:var(--tx)}
.seg{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}.seg button{flex:1;background:var(--p2);border:0;padding:5px;cursor:pointer;border-right:1px solid var(--bd)}.seg button:last-child{border:0}.seg button.on{background:var(--acc2);color:#0a0620;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:3px 9px;border-radius:99px;background:var(--p3);border:1px solid var(--bd);cursor:pointer;font-size:12px}.chip:hover{border-color:var(--acc2)}.chip.on{background:var(--acc2);color:#0a0620;border-color:var(--acc2)}
/* brand */
#m-brand{grid-template-columns:420px 1fr}.pad{padding:14px 18px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:var(--r);padding:8px}.card canvas{width:100%;display:block;border-radius:6px}.card .cap{font-size:12px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.sw:not(.hd){height:56px;border-radius:9px;border:1px solid rgba(255,255,255,.12);display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;font-weight:700}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}.thumbs .th{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);background:var(--p2)}.thumbs img{width:100%;height:100%;object-fit:contain}.thumbs .x{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.7);border:0;border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:16px;padding:0;color:#fff;font-size:11px}
h3{margin:14px 0 6px;font-size:15px}.fine{font-size:12px;color:var(--mut)}


.pipbar{position:absolute;left:10px;top:10px;z-index:6;width:214px;max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;background:rgba(20,24,28,.95);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.45);text-align:left}.pipbar .fld{margin:0}.pipbar .fld .row{gap:6px;flex-wrap:wrap}.pipbar select{min-width:0;flex:1 1 100%}.pipbar input[type=number]{width:70px}.pipbar label{font-size:11px;color:var(--mut)}.pipbar .seg button{padding:5px 0;font-size:13px}.pip-hd{display:flex;align-items:center;gap:8px;color:var(--acc)}.pip-hd b{flex:1}.pipbar .hint{font-size:11px;line-height:1.35}.imp{min-width:min(560px,84vw)}.imptabs{margin-bottom:10px}.imptabs button{padding:7px 4px;font-size:13px}.impv{min-height:150px}.impgrid{max-height:46vh;overflow:auto}.pipgrid{display:grid;grid-template-columns:repeat(3,36px);gap:4px}.pipgrid button{height:30px;border:1px solid var(--bd);background:var(--p3);color:inherit;border-radius:8px;cursor:pointer;font-size:15px}.pipgrid button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* nagrywanie: prompter */
.rec-back{background:transparent!important;pointer-events:none;display:block!important}
.rec-win{pointer-events:auto;position:fixed;display:flex!important;flex-direction:column;gap:8px;padding:10px 12px!important;overflow:hidden!important;resize:both;min-width:440px;min-height:420px;max-width:99vw;max-height:98vh!important;box-shadow:0 24px 80px rgba(0,0,0,.8),0 0 0 1px rgba(139,108,255,.55)!important;background:radial-gradient(120% 90% at 100% 0%,rgba(139,108,255,.16),transparent 55%),var(--p1)!important}
.rec-win.full{left:6px!important;top:6px!important;width:calc(100vw - 12px)!important;height:calc(100vh - 12px)!important;resize:none}
.rec-win .rec-hd{display:flex;align-items:center;gap:8px;font-weight:700;cursor:move;user-select:none}
.rec-win>*{flex:none}.rec-win>.rec-pr{flex:1 1 0}.rec-win .rec-hd span{white-space:nowrap}.rec-win .rec-hd .fine{overflow:hidden;text-overflow:ellipsis}.rec-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rec-tools .meter{min-width:120px}
.rec-pr{position:relative;flex:1;min-height:140px;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.rec-pr textarea{position:absolute;top:0;height:100%;background:transparent;border:0;outline:0;color:#fff;resize:none;overflow-y:auto;scrollbar-width:thin;font-family:"Inter","Segoe UI",system-ui,sans-serif;box-sizing:border-box;min-height:0;white-space:pre-wrap}
.rec-pr textarea::placeholder{color:#5b646e}
.rec-guide{position:absolute;left:0;right:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,122,26,.16),rgba(139,108,255,.1));border-top:1px solid rgba(255,122,26,.6);border-bottom:1px solid rgba(255,122,26,.25)}
/* ideas */
#m-ideas{grid-template-columns:380px 1fr}
.autocard{margin:6px 12px 2px;padding:6px 10px;border:1px solid rgba(139,108,255,.4);border-radius:12px;background:radial-gradient(120% 140% at 100% 0%,rgba(139,108,255,.22),transparent 60%),radial-gradient(120% 140% at 0% 100%,rgba(255,90,0,.16),transparent 60%),var(--p2);backdrop-filter:blur(6px)}
.autocard .sws{display:flex;gap:4px;margin:4px 0}.autocard .sws i{flex:1;height:10px;border-radius:6px;border:1px solid rgba(255,255,255,.14)}
.ideas{padding:0 8px 8px}.idea{padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:3px}.idea:hover{background:var(--p2)}.idea.on{background:linear-gradient(110deg,rgba(255,90,0,.16),rgba(139,108,255,.14));border-color:rgba(255,122,26,.45)}
.lv{display:inline-block;min-width:20px;text-align:center;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;color:#1a0800}.lvM{background:#58d68d}.lvU{background:#ffc24a}.lvO{background:#ff8a5e}.lvH{background:#ff6b5e}
.tag.off{background:var(--p3);color:var(--mut)}
.warnrow{margin:8px 0;padding:7px 10px;border-radius:9px;font-size:13px;border:1px solid #6b5a22;background:#2a2410}.warnrow.bad{border-color:#7a3a2c;background:#2e1712}.warnrow a{color:var(--acc2)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}.strip .card.sm{flex:none;padding:6px}.strip canvas{width:auto;height:auto;max-width:none}
.thumbs.wide .th{width:54px;height:68px}
table.qc td{vertical-align:top}
/* video */
#v-left .btn{white-space:normal;line-height:1.25}
#m-audio .btn,#m-creative .btn{white-space:normal;line-height:1.2}
#m-video{grid-template-columns:280px 1fr 310px;grid-template-rows:1fr 340px;grid-template-areas:"l c r" "t t t"}
@media (min-height:960px){#m-video{grid-template-rows:1fr 430px}}
#v-left{grid-area:l}#v-center{grid-area:c;display:flex;flex-direction:column;min-height:0;min-width:0}#v-right{grid-area:r}#v-tl{grid-area:t;background:var(--p1);border-top:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.tl-bar{display:flex;gap:6px;padding:6px 10px;align-items:center;border-bottom:1px solid var(--bd);flex-wrap:wrap}.tl-tempo{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--p3);white-space:nowrap}.tl-tempo input[type=range]{width:64px;margin:0}.tl-tempo .btn{padding:2px 6px}.tl-tempo b{min-width:34px;text-align:right;color:var(--acc)}.tl-tempo.off{opacity:.5}.pipbar label b,.tl-tempo b.tmv{color:var(--acc)}.tl-bar .time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc);min-width:96px}
.tl-wrap{flex:1;display:flex;min-height:0;overflow:hidden}.tl-names{width:132px;flex:none;border-right:1px solid var(--bd);background:var(--p1);overflow:hidden}.tl-names div{height:30px;display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--bd)}
.tl-scroll{flex:1;overflow:auto;position:relative}.tl-inner{position:relative}.tl-ruler{height:24px;position:sticky;top:0;z-index:5;background:var(--p2);border-bottom:1px solid var(--bd);cursor:pointer}.tl-ruler i{position:absolute;top:0;bottom:0;border-left:1px solid var(--bd);font-style:normal;font-size:10px;color:var(--mut);padding-left:3px}
.tl-track{height:30px;border-bottom:1px solid var(--bd);position:relative}.tl-track:nth-child(even){background:rgba(255,255,255,.025)}
.clip{position:absolute;top:3px;height:24px;border-radius:6px;background:#2d6a8f;border:1px solid rgba(255,255,255,.25);font-size:11px;padding:3px 14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;user-select:none}.clip.sel{outline:2px solid var(--acc);z-index:3}.clip .eh{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}.clip .eh.l{left:0}.clip .eh.rr{right:0}
.tl-names div.tn{justify-content:space-between;gap:2px}.tn .tnl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}.tn-add{flex:none;width:20px;height:18px;line-height:14px;padding:0;border:1px solid var(--bd);border-radius:5px;background:var(--p2);color:var(--acc);cursor:pointer;font-size:13px}.tn-add:hover{background:var(--p3)}.tl-ph{position:absolute;left:10px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;color:var(--mut);opacity:.6;pointer-events:none;white-space:nowrap}
.tl-names div.head,.tl-names div.bg{font-weight:700}.tl-names div.head{color:#ff7fb0}.tl-track.head{background:rgba(224,69,123,.07)!important}.tl-track.bg{background:rgba(59,90,138,.10)!important}.tl-track.drop{background:rgba(80,200,120,.22)!important;box-shadow:inset 0 0 0 2px #50c878}.tl-track.deny{background:rgba(255,80,80,.14)!important;cursor:not-allowed}
.clip.drag{z-index:30;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none}.clip.head{background:linear-gradient(90deg,#e0457b,#a02f9a);border-color:rgba(255,200,230,.55)}.clip.bg{background:repeating-linear-gradient(45deg,#3b5a8a 0 7px,#34507c 7px 14px)}
.lylist{max-height:250px;overflow:auto;border:1px solid var(--bd);border-radius:8px;background:var(--p2)}.lyr{display:flex;align-items:center;gap:3px;padding:2px 5px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:12px;border-left:3px solid #2d6a8f}.lyr:last-child{border-bottom:0}.lyr:hover{background:rgba(255,255,255,.06)}.lyr.sel{background:rgba(255,255,255,.13);outline:1px solid var(--acc);outline-offset:-1px}.lyr.head{border-left-color:#e0457b}.lyr.bg{border-left-color:#3b5a8a}.lyr.text{border-left-color:#7a4fb0}.lyr.image{border-left-color:#2f8f6f}.lyr.graphic{border-left-color:#a8662e}.lyr.anim{border-left-color:#9a3f6a}
.lyr .lyi{width:18px;text-align:center;flex:none}.lyr .lyn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lyr.hid .lyn{opacity:.45;text-decoration:line-through}.lyr .btn.sm{padding:0 3px;min-width:0;line-height:1.4;flex:none;background:transparent;border-color:transparent}.lyr .btn.sm:hover{background:var(--p3)}
.clip.text{background:#7a4fb0}.clip.image{background:#2f8f6f}.clip.graphic{background:#a8662e}.clip.anim{background:#9a3f6a}.clip.bg{background:#3b5a8a}.clip.video{background:#2d6a8f}.clip.voice{background:#2f9d8d}.clip.music{background:#6a8f2d}.clip.sfx{background:#8f7d2d}
.clip canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:6;pointer-events:none}.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--bad)}
.vprev{flex:1}
/* audio */
#m-audio{grid-template-columns:300px 1fr 330px}.wave{background:#0b0e10;border:1px solid var(--bd);border-radius:10px;position:relative;height:180px;cursor:crosshair;overflow:hidden}.wave canvas{width:100%;height:100%;display:block}
.meter{height:10px;background:var(--p3);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 80%,var(--bad))}
.qc{width:100%;border-collapse:collapse;font-size:13px}.qc td{padding:5px 8px;border-bottom:1px solid var(--bd)}.qc tr:nth-child(even){background:rgba(255,255,255,.03)}

5 (v3: akcja \u201eidea\u201d dopisuje wiersz do arkusza Lista rolek)\nconst LIST_ID = '__LIST_ID__';      // ID arkusza \u201eLista rolek\u201d wstawia aplikacja (gdy brak: szukam arkusza o tej nazwie w folderze g\u0142\u00f3wnym)\nconst LIST_NAME = 'Lista rolek';\nconst DIR_WORK = 'Materia\u0142y', DIR_DONE = 'Opublikowane';\n\nfunction folder_() {\n  if (FOLDER_ID && FOLDER_ID.indexOf('__') !== 0) return DriveApp.getFolderById(FOLDER_ID);\n  const it = DriveApp.getFoldersByName(FOLDER_NAME);\n  while (it.hasNext()) { const f = it.next(); if (!f.isTrashed()) return f; }\n  return DriveApp.createFolder(FOLDER_NAME);\n}\nfunction clean_(s) { return String(s || '').replace(/[\\\\:*?\"<>|]+/g, ' ').replace(/\\s+/g, ' ').trim().slice(0, 100); }\n// folder pod \u015bcie\u017ck\u0105 \u201eMateria\u0142y/R001-Efekt reflektora\u201d (poziom po poziomie); create=true zak\u0142ada brakuj\u0105ce, create=false zwraca null, gdy czego\u015b brak\nfunction path_(root, path, create) {\n  const parts = String(path || '').split('/').map(clean_).filter(Boolean);\n  let cur = root;\n  for (let i = 0; i < parts.length; i++) {\n    let found = null; const it = cur.getFoldersByName(parts[i]);\n    while (it.hasNext()) { const x = it.next(); if (!x.isTrashed()) { found = x; break; } }\n    if (!found) { if (!create) return null; found = cur.createFolder(parts[i]); }\n    cur = found;\n  }\n  return cur;\n}\nfunction list_(root) { // arkusz \u201eLista rolek\u201d: po ID, a gdy go nie ma, po nazwie w folderze g\u0142\u00f3wnym\n  if (LIST_ID && LIST_ID.indexOf('__') !== 0) { try { return SpreadsheetApp.openById(LIST_ID); } catch (e) { /* szukam po nazwie */ } }\n  const it = root.getFilesByName(LIST_NAME);\n  while (it.hasNext()) { const f = it.next(); if (!f.isTrashed() && f.getMimeType() === MimeType.GOOGLE_SHEETS) return SpreadsheetApp.open(f); }\n  return null;\n}\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);  }\n    const f = path_(root, b.sub, true);\n    if (b.action === 'text') { // ma\u0142y plik tekstowy (opis rolki obok pliku wideo); ta sama nazwa = nadpisanie, bez duplikat\u00f3w\n      const nm = String(b.name || 'opis.txt'), same = f.getFilesByName(nm);\n      while (same.hasNext()) { const x = same.next(); if (!x.isTrashed()) { x.setContent(String(b.text || '')); return out_({ ok: true, id: x.getId(), url: x.getUrl(), replaced: true }); } }\n      const file = f.createFile(nm, String(b.text || ''), MimeType.PLAIN_TEXT);\n      return out_({ ok: true, id: file.getId(), url: file.getUrl() });\n    }\n    if (b.action === 'init') { // sesja wznawialnego uploadu: kawa\u0142ki wysy\u0142a aplikacja\n      const mime = String(b.mime || 'video/mp4');\n      if (b.replace) { const old = f.getFilesByName(String(b.name)); while (old.hasNext()) { const x = old.next(); if (!x.isTrashed()) x.setTrashed(true); } } // archiwum tej samej nazwy: stary plik trafia do kosza Drive (do odzyskania), nie powstaje duplikat\n      const r = UrlFetchApp.fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,webViewLink', {\n        method: 'post', contentType: 'application/json; charset=UTF-8', muteHttpExceptions: true,\n        headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken(), 'X-Upload-Content-Type': mime, 'X-Upload-Content-Length': String(b.size) },\n        payload: JSON.stringify({ name: String(b.name), mimeType: mime, parents: [f.getId()] })\n      });\n      if (r.getResponseCode() !== 200) return out_({ ok: false, error: 'Drive ' + r.getResponseCode() + ': ' + r.getContentText().slice(0, 300) });\n      const h = r.getAllHeaders();\n      return out_({ ok: true, url: h['Location'] || h['location'], folder: f.getUrl() });\n    }\n    return out_({ ok: false, error: 'action' });\n  } catch (err) { return out_({ ok: false, error: String((err && err.message) || err) }); }\n}\n";

function bgToLayer(bg, W, H, t0, t1) {
  let l; if (bg.type === 'image') { l = mkLayer('image', { x: W / 2, y: H / 2, w: W, h: H, name: 'Tło (obraz)' }); l.img.assetId = bg.assetId; l.img.fit = 'cover'; l.anim.loop = { p: 'kenburns', amp: 1, spd: 1 }; }
  else if (bg.type === 'glow') { l = mkLayer('fx', { x: W / 2, y: H / 2, w: W, h: H, name: 'Tło (poświata)' }); l.fx.kind = 'nightglow'; l.fx.bg = jclone(bg); l.fx.spd = 1; }
  else if (bg.type === 'grad' || bg.type === 'agrad') { l = mkLayer('shape', { x: W / 2, y: H / 2, w: W, h: H, name: 'Tło (gradient)' }); l.shape.fill = bg.c1; l.shape.fill2 = bg.c2; l.shape.gAngle = bg.angle || 90; }
  else { l = mkLayer('shape', { x: W / 2, y: H / 2, w: W, h: H, name: 'Tło' }); l.shape.fill = bg.c1; }
  l.track = 'bg'; l.t0 = t0; l.t1 = t1; return l;
}
function animateLayers(layers, style, dur) {
  let i = 0;
  for (const l of layers) {
    if (l.track === 'bg') continue; const a = l.anim; i++; const dl = Math.min(0.1 * i, dur * 0.4);
    if (style === 'calm') a.in = { p: l.type === 'text' ? 'rise' : 'fade', d: 0.8, dl, e: 'outCubic', dir: 'bottom' };
    else if (style === 'punchy') a.in = { p: l.type === 'shape' ? 'reveal' : (l.type === 'text' && /Tytu|Wezw|Liczba|Cytat/.test(l.name) ? 'pop' : 'slide'), d: 0.55, dl, e: 'outBack', dir: i % 2 ? 'left' : 'right' };
    else a.in = { p: l.type === 'text' ? (/Tytu|Wezw|Cytat|Opis|Liczba/.test(l.name) ? 'words' : 'rise') : l.type === 'shape' ? 'reveal' : 'zoom', d: l.type === 'text' ? 0.9 : 0.6, dl, e: 'outCubic', dir: 'left' };
    a.out = { p: 'fade', d: 0.3, dl: 0, e: 'inCubic', dir: 'bottom' };
  }
  return layers;
}
function sceneToReel(kind, c, t0, dur, style, seq) { // zwraca warstwy z przesuniętym czasem
  const sc = makeScene(kind, Object.assign({}, c, { total: 0, idx: null }), 'story', seq), t1 = t0 + dur, out = [];
  out.push(bgToLayer(sc.bg, sc.w, sc.h, t0, t1)); for (const l of sc.layers) { l.t0 = t0; l.t1 = t1; out.push(l); }
  animateLayers(out, style || 'dynamic', dur); return out;
}

const AI = {

  async post(url, body, isForm) {

    if (!r.ok) throw new Error(({ no_key: 'Brak klucza dostawcy w Workerze (' + url + ')', rate: 'Limit zapytań na godzinę (spróbuj za chwilę)', forbidden: 'Odmowa dostępu (403)', ai_error: 'Błąd modelu: ' + (j.msg || '') }[j.code]) || ('HTTP ' + r.status + ' ' + (j.msg || j.raw || j.code || ''))); return j;
  },
  async text(system, user, max = 2200, model) { // zwraca tekst; model: 'claude-haiku-5-5' (domyślnie) | 'claude-sonnet-5-5'
    const j = await this.post('api/n/claude', { model: model || 'claude-sonnet-5-5', max_tokens: max, system, messages: [{ role: 'user', content: user }] });
    return ((j.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('\n') || '').trim();
  },
  async json(system, user, max = 2800) {
    const t = await this.text(system + '\nOdpowiadaj WYŁĄCZNIE poprawnym JSON, bez komentarzy i bez bloków markdown.', user, max);
    const m = t.match(/[\[{][\s\S]*[\]}]/); if (!m) throw new Error('Model nie zwrócił JSON: ' + t.slice(0, 120));

  },

   Różnicowanie: ostrzega o powtórkach (z postami i innymi pomysłami), podpowiada brakujący format, a seed pomysłu zmienia wariant tła i nagłówków. */
