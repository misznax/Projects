<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111">
<title>Notatnik Słuchacza</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:#111;color:#eee;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 0}h1{font-size:18px;margin:0;flex:1}
button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid #444;background:#222;color:#eee;padding:8px 12px}
button.p{background:#2563eb;border-color:#2563eb}button.r{background:#dc2626;border-color:#dc2626}button.s{padding:4px 10px;font-size:13px}
.card{background:#1b1b1b;border-radius:12px;padding:10px 12px;margin:8px 0}.mut{color:#999;font-size:13px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1}.tabs .on{background:#333}
.P{color:#fb923c}.O{color:#4ade80}.W{color:#60a5fa}b{font-size:12px}
pre{white-space:pre-wrap;font:inherit;margin:4px 0}
#dim{position:fixed;inset:0;background:#000;display:none;z-index:9;align-items:center;justify-content:center;color:#333}
#dlg{position:fixed;inset:0;background:#000c;display:none;z-index:8;padding:20px;overflow:auto}#dlg>div{background:#1b1b1b;border-radius:14px;padding:16px;max-width:520px;margin:auto}
input,textarea,select{width:100%;margin:4px 0}
</style></head><body>
<div id="dim" onclick="touch()">● REC <span id="dt"></span></div>
<div id="dlg"><div id="dc"></div></div>
<header><h1 onclick="go()">🎓 Notatnik Słuchacza</h1><button onclick="menu()">☰</button></header>
<div id="app"></div>
<script>
const GID='461701670960-b0ivbr1cktr8ocfbdaffpplmr09thc6j.apps.googleusercontent.com',gcid=()=>GID; // Client ID jest publiczny z założenia; stary zapis z Ustawień usuwany (powodował 401)
try{localStorage.removeItem('gcid')}catch(e){}
const $=s=>document.querySelector(s),cfg=k=>localStorage.getItem(k)||'',VER='v0.15';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tm=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(x)};
const SYS='Jesteś asystentem studenta na wykładzie. Odpowiadaj po polsku, zwięźle, rzeczowo.';
// ---------- IndexedDB
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('ns',1);r.onupgradeneeded=()=>{r.result.createObjectStore('lec',{keyPath:'id'});r.result.createObjectStore('chunk')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,mode,fn)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction(st,mode);const r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
const saveL=()=>tx('lec','readwrite',s=>s.put(L));
let L=null,LS=[],tab=0;
const S={rec:false,cursor:0,idx:0,stream:null,mr:null,to:null,wl:null,last:Date.now(),busy:false,msg:''};
const cap={stt:false,claude:false}; // czy serwer ma klucze (sekrety Workera) – wtedy nic nie wpisujesz w telefonie
const canSTT=()=>navigator.onLine&&cfg('mode')!=='offline'&&(cap.stt||cfg('oai'));
const canAI=()=>navigator.onLine&&(cap.claude||cfg('ant'));
const dur=l=>l.chunks.reduce((a,c)=>a+c.dur,0);
// ---------- widoki
async function go(){if(S.rec)return;L=null;S.sel=null;LS=(await tx('lec','readonly',s=>s.getAll())||[]).sort((a,b)=>b.date-a.date);render()}
function render(){
 _pp=-1;
 if(!L){if(S.sel){selView();return}$('#app').innerHTML=`<div style="display:flex;gap:8px"><button class=p onclick="newL()">＋ Nowy wykład</button>${LS.length?'<button onclick="selOn()">☑ Wybierz kilka</button>':''}</div>`+LS.map(l=>`<div class=card onclick="openL('${l.id}')"><div>${esc(l.title)}</div><div class=mut>${new Date(l.date).toLocaleString('pl')} · ${tm(dur(l))}</div></div>`).join('')+(LS.length?'':'<p class=mut>Brak wykładów.</p>');return}
 const pend=L.chunks.filter(c=>!c.done).length,on=navigator.onLine;
 let h=`<div style="display:flex;gap:8px"><button onclick="go()" ${S.rec?'disabled':''}>← Wykłady</button><button class=p onclick="newL()" ${S.rec?'disabled':''}>＋ Nowy</button></div><div style="display:flex;align-items:center;gap:8px;margin:8px 0"><span style="font-weight:600">${esc(L.title)}</span><button class=s onclick="ren()">✎</button></div><div class=card style="display:flex;gap:12px;align-items:center"><button class="${S.rec?'r':'p'}" onclick="toggle()" style="font-size:22px">${S.rec?'⏹ Stop':(L.pend?'⏺ Część '+(P().length+1):'⏺ Nagraj')}</button>${S.rec?'<button onclick="pause()">⏸ Przerwa</button>':''}<div><div id=el style="font-size:20px">${tm(S.rec?elapsed():dur(L))}</div><div class=mut>${on?'🌐 ☁️ chmura':'✈️ 📴 offline'}${pend?' · ⏳'+pend:''}</div></div></div>`;
 if(S.msg)h+=`<div class=mut style="color:#fbbf24">${esc(S.msg)}</div>`;
 if(S.link)h+=`<a href="${S.link}" target=_blank rel=noopener style="color:#60a5fa">Otwórz folder na Dysku ↗</a>`;
 if(pend&&!canSTT())h+=`<div class=mut style="color:#f87171">⏳ Audio czeka na transkrypcję: ${!on?'brak internetu':cfg('mode')==='offline'?'tryb „Tylko offline”':'brak klucza OpenAI (☰ → Ustawienia lub sekret OPENAI_API_KEY w Workerze)'}. Pierwszy tekst pojawia się ok. 30 s po starcie.</div>`;
 h+=`<div class=tabs><button class="${tab?'':'on'}" onclick="tab=0;render()">Notatki</button><button class="${tab?'on':''}" onclick="tab=1;render()">Transkrypcja</button><button onclick="exp()">⇪</button><button onclick="bk()">⛁</button></div><button class=p onclick="mkNotes()" style="width:100%">✨ Sporządź notatki</button>`;
 if(!tab){h+=L.notes.length?'':'<p class=mut>Notatki po ok. 5 min nagrania (internet + klucz Anthropic).</p>';
  h+=L.notes.map((n,i)=>hdr(n.start)+`<div class=card><b>${ts(n.start)} (${tm(n.end-n.start)})</b><div style="font-weight:600">${esc(n.title)}</div><pre>${esc(n.summary)}</pre>${n.authors?`<div class=card><b>AUTORZY</b><pre>${esc(n.authors)}</pre></div>`:''}${n.ver?`<div class=card><b>WERYFIKACJA</b><pre>${esc(n.ver)}</pre></div>`:''}<button class=s onclick="enrich(${i},0)">Autorzy</button> <button class=s onclick="enrich(${i},1)">Zweryfikuj</button> <button class=s onclick="delNote(${i})">🗑 Usuń</button> ${n.busy?'⏳':''}</div>`).join('')+(L.notes.length?`<button class=s onclick="delNote(-1)">🗑 Usuń wszystkie notatki</button>`:'')}
 else{const R=roles();h+=L.utt.map((u,i)=>hdr(u.s)+`<div class=card><b class=${R[i]==='Pytanie'?'P':R[i]==='Odpowiedź'?'O':'W'}>${ts(u.s)} · ${R[i]}${u.tmp?' (podgląd)':''}</b><div>${esc(u.t)}</div></div>`).join('')||'<p class=mut>Pusto.</p>'}
 $('#app').innerHTML=h}
const P=()=>L.parts||(L.parts=[{start:0,name:'Część 1'}]);
let _pp=-1;
function hdr(t){const ps=P();if(ps.length<2)return'';let k=0;ps.forEach((p,i)=>{if(t>=p.start-0.5)k=i});if(k===_pp)return'';_pp=k;return`<div class=mut style="margin-top:12px" onclick="renPart(${k})">— ${esc(ps[k].name)} ✎ —</div>`}
function renPart(k){const q=s=>esc(s).replace(/"/g,'&quot;');dlg(`<h3>Nazwa części</h3><input id=rn value="${q(P()[k].name)}"><button class=p onclick="P()[${k}].name=rn.value.trim()||P()[${k}].name;saveL();dlg();render()">Zapisz</button> <button onclick="dlg()">Anuluj</button>`)}
function ren(){const q=esc(L.title).replace(/"/g,'&quot;');dlg(`<h3>Nazwa wykładu</h3><input id=rn value="${q}" placeholder="np. Psychologia – wykład 3"><button class=p onclick="L.title=rn.value.trim()||L.title;saveL();dlg();render()">Zapisz</button> <button onclick="dlg()">Anuluj</button>`)}
function pause(){stopRec();L.pend=true;saveL();render()}
function roles(l=L){return l.utt.map((u,i)=>u.sp==='O'?'Pytanie':(i&&l.utt[i-1].sp==='O'?'Odpowiedź':'Wykładowca'))}
async function newL(){if(S.rec)return;L={id:crypto.randomUUID(),title:'Wykład '+new Date().toLocaleString('pl'),date:Date.now(),chunks:[],utt:[],notes:[],notedUntil:0};await saveL();render();ren()}
async function openL(id){L=LS.find(l=>l.id===id);render();pump()}
const elapsed=()=>dur(L)+(Date.now()-S.cs)/1000;
// ---------- nagrywanie (pliki 30 s, tylko mikrofon = mało baterii)
async function toggle(){S.rec?stopRec():startRec()}
async function startRec(){
 try{S.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:true}})}catch(e){S.msg='Brak zgody na mikrofon';render();return}
 S.mime=['audio/webm;codecs=opus','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
 if(L.pend){P().push({start:dur(L),name:'Część '+(P().length+1)});L.pend=false;saveL()}
 S.rec=true;S.cursor=dur(L);S.idx=L.chunks.length;S.msg='';S.last=Date.now();wake();cycle();startSR();
 S.tick=setInterval(tick,1000);render()}
function cycle(){
 if(!S.rec)return;
 const mr=new MediaRecorder(S.stream,{mimeType:S.mime,audioBitsPerSecond:64000}),parts=[],i=S.idx++,start=S.cursor,t0=Date.now();S.cs=t0;
 let end=0;mr.ondataavailable=e=>e.data.size&&parts.push(e.data);
 mr.onstop=async()=>{const blob=new Blob(parts,{type:S.mime});if(blob.size<500)return;
  await tx('chunk','readwrite',s=>s.put(blob,L.id+':'+i));L.chunks.push({i,start,dur:end,done:false,wall:t0});await saveL();pump()};
 mr.start();S.mr=mr;
 S.to=setTimeout(()=>{end=(Date.now()-t0)/1000;S.cursor+=end;mr.stop();cycle()},30000);
 mr._fin=()=>{end=(Date.now()-t0)/1000;S.cursor+=end;mr.stop()}}
function stopRec(){S.rec=false;clearTimeout(S.to);clearInterval(S.tick);S.mr&&S.mr._fin();S.stream&&S.stream.getTracks().forEach(t=>t.stop());
 S.wl&&S.wl.release().catch(()=>{});$('#dim').style.display='none';try{S.sr&&S.sr.stop()}catch(e){}S.sr=null;setTimeout(()=>{render();pump(true)},400)}
async function wake(){try{S.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function tick(){const e=elapsed();const x=$('#el');if(x)x.textContent=tm(e);$('#dt').textContent=tm(e);
 if(cfg('dim')!=='0'&&Date.now()-S.last>20000)$('#dim').style.display='flex'}
function touch(){S.last=Date.now();$('#dim').style.display='none'}
['touchstart','mousedown','keydown'].forEach(e=>addEventListener(e,()=>{S.last=Date.now()},{passive:true}));
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||!S.rec)return;
 wake();if(S.stream.getTracks().some(t=>t.readyState!=='live')){S.msg='⚠ Przeglądarka wstrzymała mikrofon (blokada ekranu) – wznowiono. Nie blokuj ekranu, użyj zaciemnienia.';
  try{S.stream=await navigator.mediaDevices.getUserMedia({audio:true});clearTimeout(S.to);S.mr&&S.mr._fin();cycle()}catch(e){S.rec=false}render()}});
// ---------- offline: podgląd na żywo (Web Speech) – zastępowany wynikiem z chmury
function startSR(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;
 const r=new R();r.lang='pl-PL';r.continuous=true;r.interimResults=false;S.sr=r;
 r.onresult=e=>{if(canSTT())return;const x=e.results[e.results.length-1];if(!x.isFinal)return;
  const t=elapsed();L.utt.push({s:Math.max(0,t-4),e:t,sp:'L',t:x[0].transcript.trim(),tmp:1});saveL();if(!tab)return;render()};
 r.onend=()=>{if(S.rec)try{r.start()}catch(e){}};try{r.start()}catch(e){}}
// ---------- transkrypcja: kolejka, automatycznie chmura ↔ offline
addEventListener('online',()=>{render();pump()});addEventListener('offline',render);
async function pump(final){if(S.busy||!L)return;S.busy=true;
 try{for(let c;c=L.chunks.find(x=>!x.done);){
  if(!canSTT())break;
  const blob=await tx('chunk','readonly',s=>s.get(L.id+':'+c.i));
  try{await cloud(c,blob)}catch(e){S.msg='Chmura: '+e.message;render();break}
  c.done=true;S.msg='';await saveL();render()}}
 finally{S.busy=false}await notes(final)}
async function cloud(c,blob){
 const f=new FormData();f.append('file',blob,'c.'+(blob.type.includes('mp4')?'m4a':'webm'));f.append('model','gpt-4o-transcribe-diarize');
 f.append('response_format','diarized_json');f.append('chunking_strategy','auto');f.append('language','pl');
 const r=cap.stt?await fetch('/api/n/stt',{method:'POST',body:f}):await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+cfg('oai')},body:f});
 if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,80));
 const segs=(await r.json()).segments||[],tt={};
 segs.forEach(s=>tt[s.speaker]=(tt[s.speaker]||0)+(s.end-s.start));
 const dom=Object.keys(tt).sort((a,b)=>tt[b]-tt[a])[0]; // najdłużej mówiący w fragmencie = wykładowca
 L.utt=L.utt.filter(u=>!(u.tmp&&u.s>=c.start-1&&u.s<c.start+c.dur+1));
 const out=[];for(const s of segs){const u={s:c.start+s.start,e:c.start+s.end,sp:s.speaker===dom?'L':'O',t:(s.text||'').trim()};if(!u.t)continue;
  const p=out[out.length-1];if(p&&p.sp===u.sp&&u.s-p.e<1.5){p.e=u.e;p.t+=' '+u.t}else out.push(u)}
 L.utt.push(...out);L.utt.sort((a,b)=>a.s-b.s)}
// ---------- Claude: notatki, autorzy, weryfikacja
async function claude(p,{model='claude-haiku-5-5',web=0,max=1800}={}){
 const body={model,max_tokens:max,system:SYS,messages:[{role:'user',content:p}]};if(web)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3}];
 const r=cap.claude?await fetch('/api/n/claude',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
  :await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':cfg('ant'),'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(r.status);return(await r.json()).content.filter(b=>b.type==='text').map(b=>b.text).join('')}
const line=(u,r)=>`[${Math.floor(u.s)}] ${r==='Pytanie'?'PYTANIE':r==='Odpowiedź'?'ODPOWIEDŹ':'WYKŁADOWCA'}: ${u.t}`;
async function notes(force){if(!canAI()||!L)return;
 const R=roles(),fresh=L.utt.map((u,i)=>[u,R[i]]).filter(([u])=>!u.tmp&&u.s>=L.notedUntil);if(!fresh.length)return;
 const last=fresh[fresh.length-1][0],span=last.e-L.notedUntil;if(span<300&&!(force&&span>20))return;
 try{const raw=await claude(`Podziel transkrypt wykładu na tematyczne notatki (każda ok. 2–6 min). Linie: [sekundy] ROLA: tekst (WYKŁADOWCA, PYTANIE z sali, ODPOWIEDŹ wykładowcy). Dla każdej: title, start_s, end_s, summary (3–6 punktów „• ” oddzielonych \\n; pytania z sali jako „❓ pytanie → odpowiedź”). Zwróć WYŁĄCZNIE tablicę JSON: [{"title":"","start_s":0,"end_s":0,"summary":""}]\n\n`+fresh.map(([u,r])=>line(u,r)).join('\n'));
  const a=JSON.parse(raw.slice(raw.indexOf('['),raw.lastIndexOf(']')+1));
  a.forEach(n=>L.notes.push({title:n.title,start:n.start_s,end:n.end_s,summary:n.summary}));L.notedUntil=last.e;await saveL();render()}catch(e){S.msg='Notatki: '+e.message;render()}}
function delNote(i){const t=i<0?`wszystkie notatki (${L.notes.length})`:`notatkę „${esc(L.notes[i].title)}”`;dlg(`<h3>Usunąć ${t}?</h3><p class=mut>Tej operacji nie można cofnąć. Transkrypcja i nagrania zostają.</p><button class=r onclick="doDelNote(${i})">Tak, usuń</button> <button onclick="dlg()">Anuluj</button>`)}
async function doDelNote(i){if(i<0){L.notes=[];L.notedUntil=0}else L.notes.splice(i,1);await saveL();dlg();render()}
async function enrich(i,v){const n=L.notes[i];if(!canAI()){S.msg='Wymaga internetu i klucza Anthropic';render();return}
 const R=roles(),src=L.utt.map((u,k)=>[u,R[k]]).filter(([u])=>u.s>=n.start-1&&u.e<=n.end+1).map(([u,r])=>line(u,r)).join('\n');n.busy=1;render();
 try{n[v?'ver':'authors']=await claude(v?`Zweryfikuj prawdziwość tez z fragmentu wykładu. Dla każdej tezy: werdykt (potwierdzona / sporna / nieaktualna / fałszywa / brak danych), 1 zdanie uzasadnienia, źródło (URL). Nie zgaduj.\n\n${src}`:`Dla fragmentu wykładu wskaż autorów/twórców wspomnianych teorii, pojęć i tez (imię, nazwisko, rok, główne dzieło). Dopisz brakujących autorów. Jeśli nie jesteś pewien – zaznacz. Krótka lista.\n\n${src}`,{model:'claude-sonnet-5-5',web:1,max:2500})}catch(e){S.msg='Błąd AI: '+e.message}
 n.busy=0;await saveL();render()}
// ---------- eksport i okna
function md(l=L){let o=`# ${l.title}\n\n`;l.notes.forEach(n=>{o+=`## ${n.title} (${ts(n.start,l)}, ${tm(n.end-n.start)})\n${n.summary}\n\n`+(n.authors?`**Autorzy:** ${n.authors}\n\n`:'')+(n.ver?`**Weryfikacja:** ${n.ver}\n\n`:'')});
 o+='## Transkrypcja\n';const R=roles(l);l.utt.forEach((u,i)=>o+=`- [${ts(u.s,l)}] **${R[i]}**: ${u.t}\n`);
 return o}
function chat(l=L){const R=roles(l),hm=u=>{const w=wallOf(u.s,l);return(w.approx?'~':'')+w.d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})};
 let o=`📚 ${l.title}\n📅 ${new Date(l.date).toLocaleDateString('pl')} · ${tm(dur(l))}\n\n💬 ROZMOWA\n`;
 l.utt.forEach((u,i)=>{if(!u.tmp)o+=`[${hm(u)}] ${R[i]}: ${u.t}\n`});
 if(l.notes.length){o+='\n📝 NOTATKI\n';l.notes.forEach(n=>o+=`• ${n.title}: ${String(n.summary||'').replace(/\s*\n+\s*/g,' ')}\n`)}
 return o}
function exp(){const o=md();dlg(`<h3>Eksport (Markdown)</h3><textarea rows=12 readonly id=ex>${esc(o)}</textarea><button class=p onclick="ex.select();navigator.clipboard.writeText(ex.value).catch(()=>{})">Kopiuj</button> <button onclick="dlg()">Zamknij</button>`)}
function dlg(h){$('#dlg').style.display=h?'block':'none';if(h)$('#dc').innerHTML=h}
function menu(){dlg(`<button onclick="sett()">⚙ Ustawienia</button> <button onclick="sug()">💡 Sugestie</button> <button onclick="dlg();selMenu()">☑ Wybierz wykłady (wyślij / pobierz)</button> <button onclick="about()">ℹ O autorze</button> <button onclick="dlg()">✕</button>`)}
function sett(){dlg(`<h3>Ustawienia</h3><label class=mut>Tryb transkrypcji</label><select id=m onchange="localStorage.mode=this.value"><option value="">Auto (chmura ↔ offline)</option><option value=cloud ${cfg('mode')==='cloud'?'selected':''}>Tylko chmura</option><option value=offline ${cfg('mode')==='offline'?'selected':''}>Tylko offline (audio + podgląd)</option></select>
 <p class=mut>Klucze na serwerze: transkrypcja ${cap.stt?'✅':'❌'} · notatki/AI ${cap.claude?(cap.ckey?'✅':'⚠ tryb podstawowy (bez klucza Anthropic)'):'❌'}. Poniżej tylko gdy ❌ (zapis w tym telefonie).</p>
 <details ${cap.stt&&cap.claude?'':'open'}><summary class=mut>Zaawansowane: własne klucze (zwykle zbędne)</summary>
 <label class=mut>Klucz OpenAI (transkrypcja + mówcy)</label><input type=password value="${esc(cfg('oai'))}" oninput="localStorage.oai=this.value">
 <label class=mut>Klucz Anthropic (notatki, autorzy, weryfikacja)</label><input type=password value="${esc(cfg('ant'))}" oninput="localStorage.ant=this.value"></details>
 <label class=mut>Czas w transkrypcji</label><select onchange="localStorage.tmode=this.value"><option value=both ${cfg('tmode')==='both'||!cfg('tmode')?'selected':''}>Godzina · czas nagrania</option><option value=clock ${cfg('tmode')==='clock'?'selected':''}>Tylko godzina</option><option value=len ${cfg('tmode')==='len'?'selected':''}>Tylko czas nagrania</option></select>
 <label><input type=checkbox style="width:auto" ${cfg('dim')!=='0'?'checked':''} onchange="localStorage.dim=this.checked?1:0"> Zaciemnij ekran po 20 s nagrywania</label><br><br><button onclick="dlg()">Zamknij</button>`)}

// ---------- czas zegarowy, kopie zapasowe, Google Drive
function wallOf(t,l=L){const c=l.chunks.find(c=>t>=c.start-0.01&&t<c.start+c.dur+0.01)||l.chunks[l.chunks.length-1];
 return c&&c.wall?{d:new Date(c.wall+(t-c.start)*1000),approx:false}:{d:new Date(l.date+t*1000),approx:true}}
function ts(t,l=L){const m=cfg('tmode')||'both',w=wallOf(t,l),clock=(w.approx?'~':'')+w.d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 return m==='clock'?clock:m==='len'?tm(t):clock+' · '+tm(t)}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'),safe=n=>n.replace(/[^\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ -]/g,'_');
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const _js={};const loadJS=src=>_js[src]||(_js[src]=new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error('Brak internetu'));document.head.appendChild(e)}));
function cname(c,blob,l=L){const d=wallOf(c.start,l).d,p=n=>String(n).padStart(2,'0');
 return `${String(c.i+1).padStart(4,'0')}_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}.${blob&&blob.type.includes('mp4')?'m4a':'webm'}`}
function bk(){dlg(`<h3>Kopia / wysyłka</h3><p class=mut>Audio jest zapisane w kawałkach po 30 s (nazwy zawierają godzinę nagrania).</p><button class=p onclick="dlg();toDrive()">☁ Wyślij na Dysk Google (wybierz konto)</button>${L.gdir?` <a href="https://drive.google.com/drive/folders/${L.gdir}" target=_blank rel=noopener style="color:#60a5fa">Otwórz folder ↗</a>`:''}<br><br><button onclick="shareChat(1)">📤 Udostępnij jak czat (WhatsApp, SMS…)</button><br><br><button onclick="dlChat(1)">⬇ Tekst jak czat (.txt)</button><br><br><button onclick="dlg();mp3Go(1)">🎧 Audio jako MP3 (1 plik)</button><br><br><button onclick="dlg();zipAudio()">⬇ ZIP: surowe nagrania (webm) + tekst</button><br><br><button onclick="dlg();zipAudio(1)">📱 ZIP przez menu telefonu (Dysk, Pliki…)</button><br><br><button class=s onclick="dlJson()">Kopia techniczna (JSON, do przywrócenia)</button> <button onclick="dlg()">Zamknij</button>`)}
function dlJson(){dl(new Blob([JSON.stringify(L,null,1)],{type:'application/json'}),safe(L.title)+'_'+stamp()+'.json');dlg()}
const put=l=>tx('lec','readwrite',s=>s.put(l)),picked=()=>LS.filter(l=>S.sel&&S.sel.has(l.id));
function chatTxt(one){const ls=one?[L]:picked();return{ls,t:ls.map(l=>chat(l)).join('\n\n———\n\n')}}
function dlChat(one){const{ls,t}=chatTxt(one);if(!ls.length)return;dl(new Blob([t],{type:'text/plain'}),(ls.length>1?'notatnik_czat_':safe(ls[0].title)+'_czat_')+stamp()+'.txt');if(one)dlg()}
function shareChat(one){const{ls,t}=chatTxt(one);if(!ls.length)return;if(navigator.share)navigator.share({title:ls.length>1?'Notatnik Słuchacza':ls[0].title,text:t}).catch(e=>{if(e.name!=='AbortError')dlChat(one)});else dlChat(one)}
function dlJsonSel(){const ls=picked();if(ls.length)dl(new Blob([JSON.stringify(ls,null,1)],{type:'application/json'}),'notatnik_kopia_'+stamp()+'.json')}
async function selMenu(){if(S.rec)return;await go();if(LS.length)selOn()}
function selOn(){S.sel=new Set();S.msg='';S.link='';render()}
function selOff(){S.sel=null;S.msg='';render()}
function selAll(){S.sel=S.sel.size===LS.length?new Set():new Set(LS.map(l=>l.id));render()}
function selTog(id,v){v?S.sel.add(id):S.sel.delete(id);render()}
function selView(){const n=S.sel.size,d=n?'':'disabled';$('#app').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="selOff()">← Wróć</button><button onclick="selAll()">${n===LS.length?'Odznacz wszystkie':'Zaznacz wszystkie'}</button></div>`
 +(S.msg?`<div class=mut style="color:#fbbf24;margin-top:8px">${esc(S.msg)}</div>`:'')+(S.link?`<a href="${S.link}" target=_blank rel=noopener style="color:#60a5fa">Otwórz folder na Dysku ↗</a>`:'')
 +LS.map(l=>`<label class=card style="display:flex;gap:10px;align-items:center"><input type=checkbox style="width:auto" ${S.sel.has(l.id)?'checked':''} onchange="selTog('${l.id}',this.checked)"><div><div>${esc(l.title)}</div><div class=mut>${new Date(l.date).toLocaleString('pl')} · ${tm(dur(l))}</div></div></label>`).join('')
 +`<div class=card><b>Zaznaczono: ${n}</b><br><br><button class=p ${d} onclick="toDrive(picked())">☁ Wyślij na Dysk Google (wybierz konto)</button><br><br><button ${d} onclick="shareChat()">📤 Udostępnij jak czat (WhatsApp, SMS…)</button><br><br><button ${d} onclick="dlChat()">⬇ Tekst jak czat (.txt)</button><br><br><label style="display:flex;gap:8px;align-items:center"><input type=checkbox style="width:auto" ${S.aud===false?'':'checked'} onchange="S.aud=this.checked"> Dołącz nagrania audio do ZIP</label><br><button ${d} onclick="mp3Go()">🎧 Audio jako MP3 (ZIP z plikami MP3)</button><br><br><button ${d} onclick="zipSel()">⬇ ZIP: surowe nagrania (webm) + tekst</button> <button ${d} onclick="zipSel(1)">📱 ZIP przez menu telefonu</button><br><br><button class=s ${d} onclick="dlJsonSel()">Kopia techniczna (JSON)</button></div>`}
function zipDone(zb,zn,share){if(share){window.ZF=new File([zb],zn,{type:'application/zip'});S.msg='';dlg(`<h3>ZIP gotowy</h3><p class=mut>Kliknij i wybierz „Dysk” (Google Drive) oraz swoje konto z listy telefonu.</p><button class=p onclick="shareZip()">☁ Wybierz Dysk i konto</button> <button onclick="dlg()">Zamknij</button>`)}else{dl(zb,zn);S.msg='✅ ZIP gotowy (sprawdź Pobrane)'}}
const LAME='https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
async function toMp3(l,prog){await loadJS(LAME);const ctx=new(window.AudioContext||window.webkitAudioContext)(),out=[];let enc=null,ok=0;
 try{for(const[k,c]of l.chunks.entries()){const b=await tx('chunk','readonly',s=>s.get(l.id+':'+c.i));prog(k+1,l.chunks.length);if(!b)continue;
   let buf;try{const ab=await b.arrayBuffer();buf=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);p&&p.catch&&p.catch(rej)})}catch(e){continue}
   const n=buf.length,pcm=new Int16Array(n),a=buf.getChannelData(0),z=buf.numberOfChannels>1?buf.getChannelData(1):null;
   for(let i=0;i<n;i++){const v=z?(a[i]+z[i])/2:a[i];pcm[i]=Math.max(-1,Math.min(1,v))*32767}
   enc=enc||new lamejs.Mp3Encoder(1,buf.sampleRate,64);
   for(let i=0;i<n;i+=1152){const m=enc.encodeBuffer(pcm.subarray(i,i+1152));if(m.length)out.push(m)}
   ok++;await new Promise(r=>setTimeout(r,0))}
  if(!ok)throw new Error('ta przeglądarka nie odczytuje tych nagrań (webm) – użyj ZIP z surowymi plikami');
  out.push(enc.flush());return new Blob(out,{type:'audio/mpeg'})}finally{try{ctx.close()}catch(e){}}}
async function mp3Go(one){const ls=one?[L]:picked();if(!ls.length)return;try{let z=null;if(ls.length>1){await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');z=new JSZip()}
 for(const[k,l]of ls.entries()){const blob=await toMp3(l,(a,b)=>{S.msg=`MP3${ls.length>1?` (wykład ${k+1}/${ls.length})`:''}: ${a}/${b}`;render()}),name=safe(l.title)+'_'+new Date(l.date).toISOString().slice(0,10)+'.mp3';
  if(z)z.file(String(k+1).padStart(2,'0')+'_'+name,blob,{compression:'STORE'});else dl(blob,name)}
 if(z)dl(await z.generateAsync({type:'blob',streamFiles:true}),'notatnik_mp3_'+stamp()+'.zip');S.msg='✅ MP3 gotowe (sprawdź Pobrane)'}catch(e){S.msg='MP3: '+e.message}render()}
async function zipSel(share){const ls=picked();if(!ls.length)return;try{S.msg='ZIP: przygotowuję…';render();await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
 const z=new JSZip(),au=S.aud!==false,tot=au?ls.reduce((a,l)=>a+l.chunks.length,0):0;let n=0;
 for(const[k,l]of ls.entries()){const f=z.folder(String(k+1).padStart(2,'0')+'_'+safe(l.title));
  if(au)for(const c of l.chunks){const b=await tx('chunk','readonly',s=>s.get(l.id+':'+c.i));if(b)f.file(cname(c,b,l),b,{compression:'STORE'});S.msg=`ZIP: ${++n}/${tot}`;if(n%10==0)render()}
  f.file('rozmowa.txt',chat(l));f.file('notatki.md',md(l))}
 S.msg='ZIP: pakuję…';render();zipDone(await z.generateAsync({type:'blob',streamFiles:true}),'notatnik_'+ls.length+'_wykladow_'+stamp()+'.zip',share)}catch(e){S.msg='ZIP: '+e.message}render()}
async function zipAudio(share){try{S.msg='ZIP: przygotowuję…';render();await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');const z=new JSZip();let n=0;
 for(const c of L.chunks){const b=await tx('chunk','readonly',s=>s.get(L.id+':'+c.i));if(b)z.file(cname(c,b),b,{compression:'STORE'});S.msg=`ZIP: ${++n}/${L.chunks.length}`;if(n%10==0)render()}
 z.file('transkrypcja.md',md());S.msg='ZIP: pakuję…';render();const zb=await z.generateAsync({type:'blob',streamFiles:true}),zn=safe(L.title)+'.zip';
 zipDone(zb,zn,share)}catch(e){S.msg='ZIP: '+e.message}render()}
function shareZip(){try{if(navigator.canShare&&navigator.canShare({files:[ZF]}))navigator.share({files:[ZF],title:ZF.name}).then(()=>dlg()).catch(e=>{if(e.name!=='AbortError'){dl(ZF,ZF.name);dlg()}});else{dl(ZF,ZF.name);dlg()}}catch(e){dl(ZF,ZF.name);dlg()}}
async function mkNotes(){if(!canAI()){S.msg='Notatki wymagają internetu i klucza Anthropic (☰ → Ustawienia: „notatki/AI” musi być ✅)';render();return}
 const n0=L.notes.length;S.msg='✨ Tworzę notatki…';render();S.busy=false;await pump(true);S.msg=L.notes.length>n0?'':'Brak nowego tekstu do notatek (lub błąd – sprawdź komunikat)';render()}
const gtoken=()=>new Promise(async(res,rej)=>{try{if(!gcid())throw new Error('Wpisz Google Client ID w Ustawieniach');await loadJS('https://accounts.google.com/gsi/client');
 google.accounts.oauth2.initTokenClient({client_id:gcid(),scope:'https://www.googleapis.com/auth/drive.file',prompt:'select_account',error_callback:e=>rej(new Error(e&&e.type==='popup_failed_to_open'?'Przeglądarka zablokowała okno logowania – zezwól na wyskakujące okna dla tej strony':e&&e.type==='popup_closed'?'Okno logowania zamknięte':'Logowanie Google: '+((e&&(e.message||e.type))||'błąd'))),callback:r=>r.access_token?res(r.access_token):rej(new Error('[ID '+gcid().slice(0,6)+'…'+gcid().slice(-30,-24)+'] '+(r.error==='access_denied'?'Brak zgody. Aplikacja Google jest w trybie testowym – opublikuj ją (Google Cloud → Auth platform → Audience → Publish app) albo dodaj konto w Test users':r.error==='invalid_client'?'Google nie zna tego Client ID (sprawdź projekt w Google Cloud)':'Google: '+(r.error_description||r.error||'brak zgody'))))}).requestAccessToken()}catch(e){rej(e)}});
async function gerr(r){let t='';try{t=await r.text()}catch(e){}
 if(/accessNotConfigured|has not been used|SERVICE_DISABLED/i.test(t))return new Error('Włącz „Google Drive API” w Google Cloud (APIs & Services → Library)');
 if(r.status===401)return new Error('Sesja Google wygasła – spróbuj ponownie');
 if(r.status===403)return new Error('Google odmówił dostępu (403): '+t.slice(0,120));
 return new Error('Drive '+r.status+' '+t.slice(0,100))}
async function gfolder(tok,name,parent){const r=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',...(parent?{parents:[parent]}:{})})});if(!r.ok)throw await gerr(r);return(await r.json()).id}
async function gput(tok,name,blob,parent){const b='B'+Math.random().toString(36).slice(2),meta=JSON.stringify({name,parents:[parent]});
 const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${b}--`]);
 const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+b},body});if(!r.ok)throw await gerr(r);return(await r.json()).id}
async function toDrive(ls){ls=ls||[L];try{S.link='';S.msg='Drive: wybierz konto Google…';render();const tok=await gtoken(),H={Authorization:'Bearer '+tok};
 let who='';try{who=(await(await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:H})).json()).user.emailAddress}catch(e){}
 const ok=async id=>id&&(await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?fields=id,trashed',{headers:H})).ok,rk='groot_'+who,acc='Drive'+(who?' ('+who+')':'');
 S.msg=acc+': wysyłam…';render();
 let root=cfg(rk);if(!(await ok(root))){root=await gfolder(tok,'Notatnik Słuchacza');localStorage[rk]=root}
 let k=0;for(const l of ls){k++;const pre=acc+(ls.length>1?` · wykład ${k}/${ls.length}`:'')+': ';
  if((l.gacc||'')!==who){l.gdir='';l.chunks.forEach(c=>{delete c.gid});l.gacc=who}
  if(!(await ok(l.gdir))){l.gdir=await gfolder(tok,l.title+' '+new Date(l.date).toISOString().slice(0,10),root);await put(l)}
  const todo=l.chunks.filter(c=>!c.gid);let n=0;
  for(const c of todo){const b=await tx('chunk','readonly',s=>s.get(l.id+':'+c.i));if(!b){c.gid='-';continue}c.gid=await gput(tok,cname(c,b,l),b,l.gdir);await put(l);S.msg=pre+`${++n}/${todo.length}`;render()}
  await gput(tok,'rozmowa_'+stamp()+'.txt',new Blob([chat(l)],{type:'text/plain'}),l.gdir);
  await gput(tok,'notatki_'+stamp()+'.md',new Blob([md(l)],{type:'text/markdown'}),l.gdir);
  await gput(tok,'kopia_techniczna_'+stamp()+'.json',new Blob([JSON.stringify(l)],{type:'application/json'}),l.gdir);await put(l)}
 S.link='https://drive.google.com/drive/folders/'+(ls.length>1?root:ls[0].gdir);S.msg='✅ Wysłano'+(ls.length>1?' ('+ls.length+' wykładów)':'')+(who?' na konto '+who:'')+' (Mój Dysk → Notatnik Słuchacza)'}catch(e){S.msg='Drive: '+e.message}render()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(gcid())loadJS('https://accounts.google.com/gsi/client').catch(()=>{});
fetch('/api/n/status').then(r=>r.ok?r.json():{}).then(j=>{cap.stt=!!j.stt;cap.claude=!!j.claude;cap.ckey=!!j.ckey;pump()}).catch(()=>{});
