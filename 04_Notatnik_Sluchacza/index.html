<div id=upd onclick="location.replace(location.pathname+'?v='+Date.now())" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#f59e0b;color:#000;padding:10px;text-align:center;font-weight:600">🔄 Jest nowa wersja – kliknij, aby odświeżyć</div><div id="pl"><button id=pp onclick="plToggle()">▶</button><input type=range id=ps min=0 max=1 step=1 value=0 oninput="plDrag(this.value)" onchange="plSeek(this.value)"><span id=pt class=mut>0:00 / 0:00</span><button class=s id=pv onclick="plSpeed()">1×</button></div>
<script>
const GID='461701670960-b0ivbr1cktr8ocfbdaffpplmr09thc6j.apps.googleusercontent.com',gcid=()=>GID; // Client ID jest publiczny z założenia; stary zapis z Ustawień usuwany (powodował 401)
try{localStorage.removeItem('gcid')}catch(e){}
const $=s=>document.querySelector(s),cfg=k=>localStorage.getItem(k)||'',VER='v0.45';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tm=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(x)};
const SYS='Jesteś asystentem studenta na wykładzie. Odpowiadaj po polsku, zwięźle, rzeczowo.';
// ---------- IndexedDB
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('ns',1);r.onupgradeneeded=()=>{r.result.createObjectStore('lec',{keyPath:'id'});r.result.createObjectStore('chunk')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,mode,fn)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction(st,mode);const r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=ev=>rej((ev&&ev.target&&ev.target.error)||t.error||new Error('błąd zapisu w pamięci przeglądarki'));t.onabort=()=>rej(t.error||new Error('zapis w pamięci przeglądarki przerwany – prawdopodobnie brak miejsca'))})};
const saveL=()=>tx('lec','readwrite',s=>s.put(L));
let L=null,LS=[],tab=0;
const S={rec:false,cursor:0,idx:0,stream:null,mr:null,to:null,wl:null,last:Date.now(),busy:false,msg:''};
const cap={stt:false,claude:false}; // czy serwer ma klucze (sekrety Workera) – wtedy nic nie wpisujesz w telefonie
const canSTT=()=>navigator.onLine&&cfg('mode')!=='offline'&&(cap.stt||cfg('oai'));
const canAI=()=>navigator.onLine&&(cap.claude||cfg('ant'));
const dur=l=>l.chunks.reduce((a,c)=>a+c.dur,0);
// ---------- widoki
async function go(){if(S.rec)return;L=null;S.sel=null;S.msg='';S.link='';LS=(await tx('lec','readonly',s=>s.getAll())||[]).sort((a,b)=>b.date-a.date);render()}
function render(){
 _pp=-1;
 if(!L){plSync();if(S.sel){selView();return}$('#app').innerHTML=`<div style="display:flex;gap:8px"><button class=p onclick="newL()">＋ Nowy wykład</button>${LS.length?'<button onclick="selOn()">☑ Wybierz kilka</button>':''}</div>`+LS.map(l=>`<div class=card onclick="openL('${l.id}')" style="display:flex;gap:8px;align-items:center"><div style="flex:1"><div>${esc(l.title)}</div><div class=mut>${new Date(l.date).toLocaleString('pl')} · ${tm(dur(l))}</div></div><button class=s onclick="event.stopPropagation();delLec(['${l.id}'])">🗑</button></div>`).join('')+(LS.length?'':'<p class=mut>Brak wykładów.</p>');return}
 const pend=L.chunks.filter(c=>!c.done).length,on=navigator.onLine;
 let h=`<div style="display:flex;gap:8px"><button onclick="go()" ${S.rec?'disabled':''}>← Wykłady</button><button class=p onclick="newL()" ${S.rec?'disabled':''}>＋ Nowy</button></div><div style="display:flex;align-items:center;gap:8px;margin:8px 0"><span style="font-weight:600">${esc(L.title)}</span><button class=s onclick="ren()">✎</button><button class=s style="margin-left:auto" onclick="moreMenu()">⋯</button></div><div class=card style="display:flex;gap:12px;align-items:center"><button class="${S.rec?'r':'p'}" onclick="toggle()" style="font-size:22px">${S.rec?'⏹ Stop':(L.pend?'⏺ Część '+(P().length+1):'⏺ Nagraj')}</button>${S.rec?'<button onclick="pause()">⏸ Przerwa</button>':''}<div><div id=el style="font-size:20px">${tm(S.rec?elapsed():dur(L))}</div><div class=mut>${on?'🌐 ☁️ chmura':'✈️ 📴 offline'}${pend?' · ⏳ '+mm(L.chunks.filter(c=>!c.done).reduce((x,c)=>x+(c.dur||30),0)):''}</div></div></div>`;
 h+=`${stBar()}<div id=qb>${qBar()}</div>${upBox()}${ojBox()}`;
 if(S.msg&&!(S.oj&&S.oj.id===L.id))h+=`<div class=mut style="white-space:pre-line;font-size:14px;color:${/^✅/.test(S.msg)?'#4ade80':/^(Eksport|Wysyłanie|Logowanie)/.test(S.msg)?'#f87171':'#fbbf24'}">${esc(S.msg)}</div>`;
 if(S.link)h+=`<a href="${S.link}" target=_blank rel=noopener style="color:#60a5fa">Otwórz folder na Dysku ↗</a>`;
 if(pend&&!canSTT())h+=`<div class=mut style="color:#f87171">⏳ Audio czeka na transkrypcję: ${!on?'brak internetu':cfg('mode')==='offline'?'tryb „Tylko offline”':'brak klucza OpenAI (☰ → Ustawienia lub sekret OPENAI_API_KEY w Workerze)'}. Pierwszy tekst pojawia się ok. 30 s po starcie.</div>`;
 const noA=!L.chunks.length||S.rec,TB=[['Notatki','skrót','#3b82f6','Skrót – notatki z wykładu (skrócone, uporządkowane)'],['Transkrypcja','oryginał','#22c55e','Oryginał – pełny tekst wypowiedzi, nic nie skrócono'],['Weryfikacja','sprawdzenie','#f59e0b','Sprawdzenie notatek względem oryginału']];
 h+=`<div class=act><button class=sm ${noA?'disabled':''} onclick="quickOpt()"><b>🎵</b><small>Optymalizuj audio</small></button><button class=p style="flex:1" onclick="mkNotes()">✨ Sporządź notatki</button><button class=sm onclick="exDlg(1)"><b>⬆</b><small>Eksport plików</small></button></div><div class=tabs>${TB.map(([t,u,c],k)=>`<button class="${tab===k?'on':''}" style="--c:${c}" onclick="tab=${k};render()"><b>${t}${k===2&&L.verify?' ('+L.verify.items.length+')':''}</b><small>${u}</small></button>`).join('')}</div><div class=cap style="color:${TB[tab][2]};border-color:${TB[tab][2]}">${TB[tab][3]}</div>`;
 if(tab===0){h+=L.notes.length?'<div style="line-height:1.9">'+LEG+'</div>':'<p class=mut>Notatki powstają automatycznie po ok. 10 min nagrania (internet). Możesz je też zrobić ręcznie: ✨ Sporządź notatki.</p>';
  h+=L.notes.map((n,i)=>hdr(n.start)+`<div class=card><div style="display:flex;align-items:center;gap:6px"><b onclick="plAt(${n.start})" style="cursor:pointer">▶ ${ts(n.start)} (${tm(n.end-n.start)})</b><span style="flex:1">${badges(n.summary)}</span><button class=s onclick="delNote(${i})">🗑</button></div><div class=nt>${esc(n.title)}</div>${bhtml(n.summary)}${n.authors?`<div class=card><b>AUTORZY</b><pre>${esc(n.authors)}</pre></div>`:''}${n.ver?`<div class=card><b>WERYFIKACJA</b><pre>${esc(n.ver)}</pre></div>`:''}${n.busy?'<div class=mut>⏳</div>':''}</div>`).join('')}
 else if(tab===1){const R=roles();h+=L.utt.map((u,i)=>{const k=wallOf(u.s,L),w=`${k.approx?'~':''}${k.d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})}`,c=R[i]==='Pytanie'?'P':R[i]==='Odpowiedź'?'O':'W',lab=(c!=='W'||R[i]!==R[i-1])?`<b class=${c}>${R[i]}${u.tmp?' (podgląd)':''}:</b> `:'';return hdr(u.s)+`<div class="ut z${i%2}"><div class=tm onclick="plAt(${u.s})">▶ ${w}<br>${tm(u.s)}</div><div class=tx>${lab}${hl(u.t)}</div></div>`}).join('')||'<p class=mut>Pusto.</p>'}
 else h+=verHtml();
 $('#app').innerHTML=h;plSync()}
const P=()=>L.parts||(L.parts=[{start:0,name:'Część 1'}]);
let _pp=-1;
function hdr(t){const ps=P();if(ps.length<2)return'';let k=0;ps.forEach((p,i)=>{if(t>=p.start-0.5)k=i});if(k===_pp)return'';_pp=k;return`<div class=mut style="margin-top:12px" onclick="renPart(${k})">— ${esc(ps[k].name)} ✎ —</div>`}
function renPart(k){const q=s=>esc(s).replace(/"/g,'&quot;');dlg(`<h3>Nazwa części</h3><input id=rn value="${q(P()[k].name)}"><button class=p onclick="P()[${k}].name=rn.value.trim()||P()[${k}].name;saveL();dlg();render()">Zapisz</button> <button onclick="dlg()">Anuluj</button>`)}
function ren(){const q=esc(L.title).replace(/"/g,'&quot;');dlg(`<h3>Nazwa wykładu</h3><input id=rn value="${q}" placeholder="np. Psychologia – wykład 3"><button class=p onclick="L.title=rn.value.trim()||L.title;saveL();dlg();render()">Zapisz</button> <button onclick="dlg()">Anuluj</button>`)}
function pause(){stopRec();L.pend=true;saveL();render()}
function roles(l=L){return l.utt.map((u,i)=>u.sp==='O'?'Pytanie':(i&&l.utt[i-1].sp==='O'?'Odpowiedź':'Wykładowca'))}
async function newL(){if(S.rec)return;L={id:crypto.randomUUID(),title:'Wykład '+new Date().toLocaleString('pl'),date:Date.now(),chunks:[],utt:[],notes:[],notedUntil:0};await saveL();render();ren()}
async function openL(id){L=LS.find(l=>l.id===id);S.msg='';S.link='';tab=0;render();pump()}
const elapsed=()=>dur(L)+(Date.now()-S.cs)/1000;
// ---------- nagrywanie (pliki 30 s, tylko mikrofon = mało baterii)
async function toggle(){S.rec?stopRec():startRec()}
async function startRec(){
 try{S.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:true}})}catch(e){S.msg='Brak zgody na mikrofon';render();return}
 S.mime=['audio/webm;codecs=opus','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
 if(L.pend){P().push({start:dur(L),name:'Część '+(P().length+1)});L.pend=false;saveL()}
 S.rec=true;S.cursor=dur(L);S.idx=L.chunks.length;S.msg='';S.last=Date.now();wake();cycle();startSR();
 S.tick=setInterval(tick,1000);render()}
function cycle(){
 if(!S.rec)return;
 const mr=new MediaRecorder(S.stream,{mimeType:S.mime,audioBitsPerSecond:128000}),parts=[],i=S.idx++,start=S.cursor,t0=Date.now();S.cs=t0;
 let end=0;mr.ondataavailable=e=>e.data.size&&parts.push(e.data);
 mr.onstop=async()=>{const blob=new Blob(parts,{type:S.mime});if(blob.size<500)return;
  await tx('chunk','readwrite',s=>s.put(blob,L.id+':'+i));L.chunks.push({i,start,dur:end,done:false,wall:t0});await saveL();pump()};
 mr.start();S.mr=mr;
 S.to=setTimeout(()=>{end=(Date.now()-t0)/1000;S.cursor+=end;mr.stop();cycle()},30000);
 mr._fin=()=>{end=(Date.now()-t0)/1000;S.cursor+=end;mr.stop()}}
function stopRec(){S.rec=false;clearTimeout(S.to);clearInterval(S.tick);S.mr&&S.mr._fin();S.stream&&S.stream.getTracks().forEach(t=>t.stop());
 S.wl&&S.wl.release().catch(()=>{});$('#dim').style.display='none';try{S.sr&&S.sr.stop()}catch(e){}S.sr=null;setTimeout(()=>{render();pump(true)},400)}
async function wake(){try{S.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function tick(){const e=elapsed();const x=$('#el');if(x)x.textContent=tm(e);$('#dt').textContent=tm(e);
 if(cfg('dim')!=='0'&&Date.now()-S.last>20000)$('#dim').style.display='flex'}
function touch(){S.last=Date.now();$('#dim').style.display='none'}
['touchstart','mousedown','keydown'].forEach(e=>addEventListener(e,()=>{S.last=Date.now()},{passive:true}));
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||!S.rec)return;
 wake();if(S.stream.getTracks().some(t=>t.readyState!=='live')){S.msg='⚠ Przeglądarka wstrzymała mikrofon (blokada ekranu) – wznowiono. Nie blokuj ekranu, użyj zaciemnienia.';
  try{S.stream=await navigator.mediaDevices.getUserMedia({audio:true});clearTimeout(S.to);S.mr&&S.mr._fin();cycle()}catch(e){S.rec=false}render()}});
// ---------- offline: podgląd na żywo (Web Speech) – zastępowany wynikiem z chmury
function startSR(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;
 const r=new R();r.lang='pl-PL';r.continuous=true;r.interimResults=false;S.sr=r;
 r.onresult=e=>{if(canSTT())return;const x=e.results[e.results.length-1];if(!x.isFinal)return;
  const t=elapsed();L.utt.push({s:Math.max(0,t-4),e:t,sp:'L',t:x[0].transcript.trim(),tmp:1});saveL();if(tab!==1)return;render()};
 r.onend=()=>{if(S.rec)try{r.start()}catch(e){}};try{r.start()}catch(e){}}
// ---------- transkrypcja: kolejka, automatycznie chmura ↔ offline
addEventListener('online',()=>{render();pump()});addEventListener('offline',render);
const qs=(l,c)=>{S.cs=S.cs||{};const k=l.id+':'+c.i;return S.cs[k]||(S.cs[k]={})};
async function pump(final){if(!L)return;const l=L;
 if(S.busy){if(Date.now()-(S.pt||0)>240000)S.busy=false;else return}
 S.busy=true;S.pt=Date.now();const gen=S.pg=(S.pg||0)+1;if(final)S.wf=l.id;
 if(!S.rec&&(!S.wl2||S.wl2.released)&&l.chunks.some(c=>!c.done))try{navigator.wakeLock.request('screen').then(x=>{S.wl2=x}).catch(()=>{})}catch(e){}
 try{
  const free=()=>l.chunks.find(x=>{const q=qs(l,x);return!x.done&&!q.skip&&!(q.run&&Date.now()-q.run<200000)});
  const worker=async()=>{for(let c;S.pg===gen&&L===l&&(c=free());){
    if(!canSTT())return;const q=qs(l,c);q.run=Date.now();
    try{const blob=await tx('chunk','readonly',s=>s.get(l.id+':'+c.i));if(blob)await cloud(l,c,blob);
     c.done=true;q.err=0;S.fail=0;S.last='';S.nok=(S.nok||0)+1;S.pt=Date.now();(S.th=S.th||[]).push({t:Date.now(),d:c.dur||30});if(S.th.length>12)S.th.shift();await put(l);render()}
    catch(e){q.err=(q.err||0)+1;if(q.fn===undefined)q.fn=S.nok||0;S.fail=(S.fail||0)+1;S.last=e.message;
     if(q.err>=3&&(S.nok||0)>q.fn)q.skip=1;
     if(!S.rt){const d=Math.min(60000,4000*2**Math.min(S.fail-1,4));S.rtAt=Date.now()+d;S.rt=setTimeout(()=>{S.rt=0;S.rtAt=0;pump()},d)}
     render();return}
    finally{q.run=0}}};
  await Promise.all([1,2,3].map(worker))}
 finally{if(S.pg===gen)S.busy=false}
 const open=l.chunks.some(c=>!c.done&&!qs(l,c).skip);
 if(!open&&S.wl2){try{S.wl2.release()}catch(e){}S.wl2=null}
